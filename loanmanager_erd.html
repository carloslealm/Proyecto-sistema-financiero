
<div id="erd" style="padding: 1rem 0"></div>
<style>
#erd svg { width: 100%; height: auto; }
</style>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    primaryBorderColor: dark ? '#534AB7' : '#AFA9EC',
  },
});
const diagram = `erDiagram
  ROL {
    int id PK
    varchar nombre
    varchar descripcion
  }
  USUARIO {
    int id PK
    varchar nombre
    varchar apellido
    varchar email
    varchar password_hash
    varchar telefono
    boolean activo
    timestamp created_at
  }
  USUARIO_ROL {
    int usuario_id FK
    int rol_id FK
    timestamp asignado_en
  }
  CLIENTE {
    int id PK
    varchar cedula
    varchar nombre
    varchar apellido
    varchar email
    varchar telefono
    text direccion
    varchar ciudad
    decimal ingreso_mensual
    timestamp created_at
  }
  PRESTAMO {
    int id PK
    int cliente_id FK
    int asesor_id FK
    decimal monto
    decimal tasa_interes
    int plazo_meses
    enum sistema_amortizacion
    enum estado
    date fecha_aprobacion
    date fecha_desembolso
    text observaciones
    timestamp created_at
  }
  CUOTA {
    int id PK
    int prestamo_id FK
    int numero_cuota
    decimal capital
    decimal interes
    decimal valor_total
    date fecha_vencimiento
    enum estado
  }
  PAGO {
    int id PK
    int cuota_id FK
    int registrado_por FK
    decimal monto_pagado
    date fecha_pago
    varchar referencia
    enum medio_pago
    timestamp created_at
  }
  ROL ||--o{ USUARIO_ROL : "asignado a"
  USUARIO ||--o{ USUARIO_ROL : "tiene"
  USUARIO ||--o{ PRESTAMO : "gestiona"
  CLIENTE ||--o{ PRESTAMO : "solicita"
  PRESTAMO ||--o{ CUOTA : "genera"
  CUOTA ||--o{ PAGO : "recibe"
  USUARIO ||--o{ PAGO : "registra"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
