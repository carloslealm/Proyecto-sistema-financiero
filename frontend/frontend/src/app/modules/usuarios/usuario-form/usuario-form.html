<!-- src/app/modules/usuarios/usuario-form/usuario-form.html -->

<div class="page-header mb-4">
  <div>
    <h4 class="mb-1 fw-bold">➕ Nuevo Usuario</h4>
    <p class="text-muted mb-0">Crea un nuevo usuario del sistema</p>
  </div>
  <button class="btn btn-outline-secondary" (click)="cancelar()">← Volver</button>
</div>

<div class="alert alert-danger"  *ngIf="error">{{ error }}</div>
<div class="alert alert-success" *ngIf="exitoso">✅ {{ exitoso }}</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <form [formGroup]="form" (ngSubmit)="guardar()">

      <h6 class="section-title">Datos Personales</h6>
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
          <label class="form-label fw-medium">Nombre *</label>
          <input type="text" class="form-control"
                 formControlName="nombre" placeholder="Juan"
                 [class.is-invalid]="nombre.invalid && nombre.touched">
          <div class="invalid-feedback">Mínimo 2 caracteres</div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-medium">Apellido *</label>
          <input type="text" class="form-control"
                 formControlName="apellido" placeholder="García"
                 [class.is-invalid]="apellido.invalid && apellido.touched">
          <div class="invalid-feedback">Mínimo 2 caracteres</div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-medium">Email *</label>
          <input type="email" class="form-control"
                 formControlName="email" placeholder="usuario@loanmanager.com"
                 [class.is-invalid]="email.invalid && email.touched">
          <div class="invalid-feedback">Email inválido</div>
        </div>
        <div class="col-12 col-md-6">
          <label class="form-label fw-medium">Teléfono</label>
          <input type="tel" class="form-control"
                 formControlName="telefono" placeholder="3001234567">
        </div>
      </div>

      <h6 class="section-title">Seguridad</h6>
      <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
          <label class="form-label fw-medium">Contraseña *</label>
          <div class="input-group">
            <input [type]="showPass ? 'text' : 'password'"
                   class="form-control" formControlName="password"
                   placeholder="Mínimo 8 caracteres"
                   [class.is-invalid]="password.invalid && password.touched">
            <button class="btn btn-outline-secondary" type="button"
                    (click)="showPass = !showPass">
              {{ showPass ? '🙈' : '👁️' }}
            </button>
            <div class="invalid-feedback">Mínimo 8 caracteres</div>
          </div>
        </div>
      </div>

      <h6 class="section-title">Roles del Sistema</h6>
      <div class="row g-3 mb-4">
        <div class="col-12">
          <div class="roles-grid">

            <div class="rol-card" [class.selected]="form.get('esAdmin')?.value">
              <div class="form-check">
                <input type="checkbox" class="form-check-input"
                       formControlName="esAdmin" id="rolAdmin">
                <label class="form-check-label" for="rolAdmin">
                  <div class="rol-icon">👑</div>
                  <div class="rol-info">
                    <strong>Administrador</strong>
                    <small class="d-block text-muted">
                      Acceso total al sistema, gestión de usuarios
                    </small>
                  </div>
                </label>
              </div>
            </div>

            <div class="rol-card" [class.selected]="form.get('esAsesor')?.value">
              <div class="form-check">
                <input type="checkbox" class="form-check-input"
                       formControlName="esAsesor" id="rolAsesor">
                <label class="form-check-label" for="rolAsesor">
                  <div class="rol-icon">👔</div>
                  <div class="rol-info">
                    <strong>Asesor de Crédito</strong>
                    <small class="d-block text-muted">
                      Gestión de clientes y préstamos
                    </small>
                  </div>
                </label>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div class="d-flex gap-2 justify-content-end pt-2 border-top">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary px-4" [disabled]="guardando">
          <span *ngIf="guardando">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Guardando...
          </span>
          <span *ngIf="!guardando">✅ Crear Usuario</span>
        </button>
      </div>

    </form>
  </div>
</div>
