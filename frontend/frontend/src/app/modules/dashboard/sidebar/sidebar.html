<aside class="sidebar" [class.collapsed]="collapsed">
  <nav class="sidebar-nav">

    <div class="nav-section">
      <span class="nav-section-title" *ngIf="!collapsed">PRINCIPAL</span>
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">📊</span>
        <span class="nav-label" *ngIf="!collapsed">Dashboard</span>
      </a>
    </div>

    <div class="nav-section">
      <span class="nav-section-title" *ngIf="!collapsed">GESTIÓN</span>
      <a routerLink="/dashboard/clientes" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">👥</span>
        <span class="nav-label" *ngIf="!collapsed">Clientes</span>
      </a>
      <a routerLink="/dashboard/prestamos" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">💰</span>
        <span class="nav-label" *ngIf="!collapsed">Préstamos</span>
      </a>
    </div>

    <div class="nav-section" *ngIf="isAdmin">
      <span class="nav-section-title" *ngIf="!collapsed">ADMINISTRACIÓN</span>
      <a routerLink="/dashboard/usuarios" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label" *ngIf="!collapsed">Usuarios</span>
      </a>
    </div>

  </nav>
</aside>
