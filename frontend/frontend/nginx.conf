# ============================================================
#  nginx.conf — Configuración para Angular SPA
#  Ubicación: frontend/nginx.conf
# ============================================================

server {
    listen 80;
    server_name localhost;

    # Directorio raíz donde están los archivos de Angular
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip — reduce el tamaño de los archivos transferidos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Configuración crítica para Angular Router (HTML5 mode).
    # Sin esto, al refrescar /dashboard da 404 porque Nginx
    # busca un archivo llamado "dashboard" que no existe.
    # try_files: busca el archivo → si no existe, devuelve index.html
    # Angular toma el control y muestra la ruta correcta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el backend — evita problemas de CORS en producción.
    # Las peticiones a /api/v1/* se redirigen al contenedor backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para assets estáticos (JS, CSS, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
